<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal de Ponto — RH e Colaboradores</title>
<style>
:root{--orange:#e98a4a;--orange-dark:#c96f32;--orange-soft:#fff3eb;--text:#30343a;--muted:#727780;--line:#e7e8eb;--bg:#f6f7f8;--white:#fff;--green:#2f8f62;--green-soft:#eaf7f0;--yellow:#a36d10;--yellow-soft:#fff6df;--red:#b84a4a;--red-soft:#fff0f0;--blue:#3972a8;--blue-soft:#edf5fc;--shadow:0 10px 30px rgba(30,35,40,.08);--radius:18px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.topbar{background:var(--white);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--orange);display:grid;place-items:center;color:#fff;font-weight:900}.brand small{display:block;color:var(--muted);font-weight:500}.top-actions{display:flex;gap:8px}.container{max-width:1180px;margin:0 auto;padding:28px 20px 60px}.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(460px,100%);background:var(--white);border-radius:24px;box-shadow:var(--shadow);padding:34px}.logo-circle{width:56px;height:56px;border-radius:18px;background:var(--orange-soft);color:var(--orange-dark);display:grid;place-items:center;font-size:26px;margin-bottom:18px}h1,h2,h3,p{margin-top:0}h1{font-size:28px;margin-bottom:8px}h2{font-size:22px}.subtitle{color:var(--muted);margin-bottom:28px}.field{margin-bottom:16px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe1e5;border-radius:12px;padding:12px 14px;background:#fff;outline:none;transition:.15s ease}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(233,138,74,.14)}.field textarea{min-height:92px;resize:vertical}.help{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:var(--orange-dark)}.btn-light{background:#f0f1f2;color:var(--text)}.btn-danger{background:var(--red-soft);color:var(--red)}.btn-success{background:var(--green-soft);color:var(--green)}.btn-blue{background:var(--blue-soft);color:var(--blue)}.btn-block{width:100%}.link-btn{border:0;background:transparent;color:var(--orange-dark);font-weight:800;padding:6px}.auth-switch{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);text-align:center;font-size:13px;color:var(--muted)}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.hero p{color:var(--muted)}.grid{display:grid;gap:18px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 4px 14px rgba(30,35,40,.03)}.action-card{display:flex;align-items:center;justify-content:space-between;gap:16px}.action-icon{width:48px;height:48px;border-radius:14px;background:var(--orange-soft);color:var(--orange-dark);display:grid;place-items:center;font-size:22px}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}.section-title h2{margin-bottom:0}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:850px;background:#fff}th,td{padding:13px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}th{background:#fafafa;color:#60656d;font-size:12px;text-transform:uppercase;letter-spacing:.03em}tr:last-child td{border-bottom:0}tr.clickable:hover{background:#fffaf6}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800;white-space:nowrap}.badge.pending{background:var(--yellow-soft);color:var(--yellow)}.badge.analysis{background:var(--blue-soft);color:var(--blue)}.badge.done{background:var(--green-soft);color:var(--green)}.badge.rejected{background:var(--red-soft);color:var(--red)}.filters{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr 1fr;gap:10px;margin-bottom:14px}.filters input,.filters select{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 11px}.detail-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}.detail-item{padding:12px 0;border-bottom:1px solid var(--line)}.detail-item span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.detail-item strong{font-size:14px}.notice{border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13px;line-height:1.5}.notice.error{background:var(--red-soft);color:var(--red)}.notice.success{background:var(--green-soft);color:var(--green)}.notice.info{background:var(--blue-soft);color:#315f89}.notice.warn{background:var(--yellow-soft);color:var(--yellow)}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}.split{display:grid;grid-template-columns:220px 1fr;gap:20px}.sidebar{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;height:max-content;position:sticky;top:88px}.nav-btn{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:#525860;font-weight:700;margin-bottom:4px}.nav-btn.active,.nav-btn:hover{background:var(--orange-soft);color:var(--orange-dark)}.empty{text-align:center;padding:36px 20px;color:var(--muted)}.protocol{font-size:30px;font-weight:900;color:var(--orange-dark);margin:10px 0}.muted{color:var(--muted)}.small{font-size:12px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.inline-card{margin-top:18px;background:#fafafa}.locked{display:flex;gap:10px;align-items:flex-start}.locked strong{display:block;margin-bottom:3px}
@media(max-width:900px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.grid-2,.detail-list,.split{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.sidebar{position:static}.hero{flex-direction:column}.topbar{padding:12px 16px}.container{padding:22px 14px 50px}.auth-card{padding:26px 22px}.top-actions .btn-light{padding:10px}.action-card{align-items:flex-start;flex-direction:column}}

.btn:disabled{opacity:.6;cursor:not-allowed}.loading{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

.rh-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}.card.mini{padding:16px 18px}.card.mini span{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:5px}.card.mini strong{font-size:26px}.rh-filters{grid-template-columns:1.6fr 1fr 1fr 1fr 1fr}.sidebar .nav-btn:disabled{opacity:.45;cursor:not-allowed}.sidebar .nav-btn:disabled:hover{background:transparent;color:#525860}@media(max-width:900px){.rh-summary{grid-template-columns:1fr}.rh-filters{grid-template-columns:1fr 1fr}}@media(max-width:760px){.rh-filters{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const PROJECT_URL='https://rabbqemxxyojmjlbjwla.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_z4c7lzbZnqM5bxXNU3NCEQ_3andAQH9';
const AUTH_URL=`${PROJECT_URL}/auth/v1`;
const FUNCTIONS={
  login:`${PROJECT_URL}/functions/v1/login-colaborador`,
  mine:`${PROJECT_URL}/functions/v1/minhas-solicitacoes`,
  create:`${PROJECT_URL}/functions/v1/nova-solicitacao`,
  rhRequests:`${PROJECT_URL}/functions/v1/rh-solicitacoes`,
  rhTreat:`${PROJECT_URL}/functions/v1/rh-tratar-solicitacao`,
  rhEmployees:`${PROJECT_URL}/functions/v1/rh-colaboradores`
};

const state={
  currentUser:null,
  token:null,
  requests:[],
  page:'employee-login',
  selectedRequestId:null,
  loginMessage:'',
  rhUser:null,
  rhAccessToken:null,
  rhRefreshToken:null,
  rhRequests:[],
  rhSelectedRequestId:null,
  rhEmployees:[],
  rhEditingEmployeeId:null,
  rhEmployeeEditorOpen:false,
  rhEmployeeNotice:'',
  rhLoginMessage:''
};

const typeLabel={
  entrada:'Entrada',
  saida_intervalo:'Saída para intervalo',
  retorno_intervalo:'Retorno do intervalo',
  saida:'Saída',
  outro:'Outra'
};
const reasonLabel={
  esquecimento:'Esqueci de registrar',
  facial_nao_reconhecida:'Facial não reconhecida',
  falha_aparelho:'Falha do Aparelho',
  atividade_externa:'Atividade externa',
  outro:'Outro',
  aplicativo_erro:'Aplicativo apresentou erro',
  relogio_erro:'Relógio de ponto apresentou erro',
  sem_internet:'Sem internet',
  marcacao_nao_apareceu:'Marcação não apareceu'
};
const statusLabel={pendente:'Pendente',em_analise:'Em análise',concluido:'Concluído',nao_ajustado:'Não ajustado'};

function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function maskCpf(v=''){const x=String(v).replace(/\D/g,'').slice(0,11);return x.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4')}
function formatDate(iso){if(!iso)return'—';const [y,m,d]=String(iso).split('-');return d&&m&&y?`${d}/${m}/${y}`:'—'}
function formatDateTime(iso){if(!iso)return'—';try{return new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short',timeZone:'America/Sao_Paulo'}).format(new Date(iso))}catch{return'—'}}
function formatTime(v){return v?String(v).slice(0,5):'—'}
function isoLocal(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${day}`}
function addDays(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function submissionWindow(now=new Date()){const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());const daysSinceMonday=(today.getDay()+6)%7;const monday=addDays(today,-daysSinceMonday);const min=today.getDay()===1?addDays(monday,-7):monday;return{min:isoLocal(min),max:isoLocal(today),isMonday:today.getDay()===1}}
function periodHelp(){const w=submissionWindow();return w.isMonday?`Hoje também estão liberadas as marcações da semana anterior, até 23h59. Datas disponíveis: ${formatDate(w.min)} a ${formatDate(w.max)}.`:`Datas disponíveis para solicitação: ${formatDate(w.min)} a ${formatDate(w.max)}. A semana anterior encerrou na segunda-feira, às 23h59.`}
function statusBadge(raw){const s=statusLabel[raw]||raw||'Pendente';const map={'Pendente':['pending','•'],'Em análise':['analysis','◌'],'Concluído':['done','✓'],'Não ajustado':['rejected','×']};const [cls,icon]=map[s]||['pending','•'];return`<span class="badge ${cls}">${icon} ${esc(s)}</span>`}
function protocol(r){return '#'+String(r?.protocolo??'—').padStart(4,'0')}
function collaboratorOf(r){const c=r?.colaboradores;return Array.isArray(c)?(c[0]||{}):(c||{})}
function requestUnit(r){return r?.unidade_snapshot||collaboratorOf(r).unidade||'—'}
function requestSector(r){return r?.setor_snapshot||collaboratorOf(r).setor||'—'}

async function callFunction(url,body){
  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','apikey':PUBLISHABLE_KEY},body:JSON.stringify(body)});
  let data={};try{data=await res.json()}catch{}
  if(!res.ok){const err=new Error(data.erro||data.message||'Não foi possível concluir a operação.');err.status=res.status;throw err}
  return data;
}
async function callRhFunction(url,body={}){
  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','apikey':PUBLISHABLE_KEY,'Authorization':`Bearer ${state.rhAccessToken}`},body:JSON.stringify(body)});
  let data={};try{data=await res.json()}catch{}
  if(!res.ok){const err=new Error(data.erro||data.message||'Não foi possível concluir a operação.');err.status=res.status;throw err}
  return data;
}
async function authSignIn(email,password){
  const res=await fetch(`${AUTH_URL}/token?grant_type=password`,{method:'POST',headers:{'Content-Type':'application/json','apikey':PUBLISHABLE_KEY},body:JSON.stringify({email,password})});
  let data={};try{data=await res.json()}catch{}
  if(!res.ok){const msg=res.status===400?'E-mail ou senha inválidos.':(data.msg||data.message||data.error_description||'Não foi possível entrar.');const err=new Error(msg);err.status=res.status;throw err}
  return data;
}
async function authRefresh(){
  if(!state.rhRefreshToken)throw new Error('Sessão do RH expirada.');
  const res=await fetch(`${AUTH_URL}/token?grant_type=refresh_token`,{method:'POST',headers:{'Content-Type':'application/json','apikey':PUBLISHABLE_KEY},body:JSON.stringify({refresh_token:state.rhRefreshToken})});
  let data={};try{data=await res.json()}catch{}
  if(!res.ok)throw new Error('Sessão do RH expirada.');
  state.rhAccessToken=data.access_token;state.rhRefreshToken=data.refresh_token||state.rhRefreshToken;state.rhUser=data.user||state.rhUser;saveRhSession();
}
async function authLogout(){
  if(!state.rhAccessToken)return;
  try{await fetch(`${AUTH_URL}/logout`,{method:'POST',headers:{'apikey':PUBLISHABLE_KEY,'Authorization':`Bearer ${state.rhAccessToken}`}})}catch{}
}

function saveSession(){sessionStorage.setItem('pp_real_token',state.token||'');sessionStorage.setItem('pp_real_user',JSON.stringify(state.currentUser||null))}
function clearSession(){state.token=null;state.currentUser=null;state.requests=[];sessionStorage.removeItem('pp_real_token');sessionStorage.removeItem('pp_real_user')}
function saveRhSession(){sessionStorage.setItem('pp_rh_access',state.rhAccessToken||'');sessionStorage.setItem('pp_rh_refresh',state.rhRefreshToken||'');sessionStorage.setItem('pp_rh_user',JSON.stringify(state.rhUser||null))}
function clearRhSession(){state.rhUser=null;state.rhAccessToken=null;state.rhRefreshToken=null;state.rhRequests=[];state.rhSelectedRequestId=null;state.rhEmployees=[];state.rhEditingEmployeeId=null;state.rhEmployeeEditorOpen=false;state.rhEmployeeNotice='';sessionStorage.removeItem('pp_rh_access');sessionStorage.removeItem('pp_rh_refresh');sessionStorage.removeItem('pp_rh_user')}

async function refreshRequests(){
  if(!state.token)return;
  try{const data=await callFunction(FUNCTIONS.mine,{token:state.token});state.requests=data.solicitacoes||[]}
  catch(err){if(err.status===401){clearSession();state.loginMessage='Sua sessão expirou. Entre novamente.';state.page='employee-login'}throw err}
}
async function refreshRhRequests(){
  if(!state.rhAccessToken)return;
  try{const data=await callRhFunction(FUNCTIONS.rhRequests,{});state.rhRequests=data.solicitacoes||[];if(data.rh)state.rhUser={...(state.rhUser||{}),...data.rh};saveRhSession();return}
  catch(err){
    if(err.status===401){
      try{await authRefresh();const data=await callRhFunction(FUNCTIONS.rhRequests,{});state.rhRequests=data.solicitacoes||[];if(data.rh)state.rhUser={...(state.rhUser||{}),...data.rh};saveRhSession();return}
      catch{clearRhSession();state.rhLoginMessage='Sua sessão expirou. Entre novamente.';state.page='rh-login';throw err}
    }
    throw err;
  }
}

async function executarAcaoRh(payload){
  try{return await callRhFunction(FUNCTIONS.rhTreat,payload)}
  catch(err){
    if(err.status===401){
      try{await authRefresh();return await callRhFunction(FUNCTIONS.rhTreat,payload)}
      catch{clearRhSession();state.rhLoginMessage='Sua sessão expirou. Entre novamente.';state.page='rh-login';throw err}
    }
    throw err;
  }
}

async function chamarRhComRenovacao(url,payload={}){
  try{return await callRhFunction(url,payload)}
  catch(err){
    if(err.status===401){
      try{await authRefresh();return await callRhFunction(url,payload)}
      catch{clearRhSession();state.rhLoginMessage='Sua sessão expirou. Entre novamente.';state.page='rh-login';throw err}
    }
    throw err;
  }
}
async function refreshRhEmployees(){
  if(!state.rhAccessToken)return;
  const data=await chamarRhComRenovacao(FUNCTIONS.rhEmployees,{acao:'listar'});
  state.rhEmployees=data.colaboradores||[];
}
async function saveRhEmployee(payload){return await chamarRhComRenovacao(FUNCTIONS.rhEmployees,{acao:'salvar',...payload})}

function employeeLogin(){return`<div class="auth-wrap"><div class="auth-card"><div class="logo-circle">🕐</div><h1 style="margin-top:16px">Portal de Ponto</h1><p class="subtitle">Ajustes e ocorrências de marcação.</p>${state.loginMessage?`<div class="notice info">${esc(state.loginMessage)}</div>`:''}<div id="loginError"></div><form id="employeeLoginForm"><div class="field"><label>CPF</label><input id="cpf" inputmode="numeric" placeholder="Digite seu CPF" maxlength="14" required><div class="help">Você pode digitar o CPF com ou sem pontuação.</div></div><div class="field"><label>Nº do crachá</label><input id="badge" inputmode="numeric" placeholder="Digite o número do crachá" required></div><button class="btn btn-primary btn-block" id="loginBtn">Entrar</button></form><div class="auth-switch">Acesso do RH: <button class="link-btn" data-go="rh-login">entrar como RH</button></div></div></div>`}
function employeeShell(content){const u=state.currentUser;return`<div class="shell"><header class="topbar"><div class="brand"><div class="brand-mark">P</div><div>Portal de Ponto<small>${esc(u?.nome||'')}</small></div></div><div class="top-actions"><button class="btn btn-light" data-go="employee-home">Início</button><button class="btn btn-light" id="employeeLogout">Sair</button></div></header><main class="container">${content}</main></div>`}
function employeeHome(){const u=state.currentUser;const mine=[...state.requests];return employeeShell(`<div class="hero"><div><h1>Olá, ${esc((u.nome||'').split(' ')[0])} 👋</h1><p>${esc(u.unidade)} • ${esc(u.setor)}</p></div></div><div class="card action-card" style="margin-bottom:22px"><div style="display:flex;gap:14px;align-items:center"><div class="action-icon">＋</div><div><h3 style="margin-bottom:4px">Precisa ajustar uma marcação?</h3><p style="margin:0;color:var(--muted)">Abra uma solicitação para cada marcação que precisa de ajuste.</p></div></div><button class="btn btn-primary" data-go="employee-new">Nova solicitação</button></div><div class="notice info"><strong>Prazo de solicitação</strong><br>${periodHelp()}</div><div class="card"><div class="section-title"><h2>Minhas solicitações</h2><button class="btn btn-light" id="refreshMine">Atualizar</button></div>${mine.length?`<div class="table-wrap"><table><thead><tr><th>Nº</th><th>Data</th><th>Marcação</th><th>Horário</th><th>Status</th></tr></thead><tbody>${mine.map(r=>`<tr class="clickable" data-employee-request="${esc(r.id)}"><td>${protocol(r)}</td><td>${formatDate(r.data_ocorrencia)}</td><td>${esc(typeLabel[r.tipo_marcacao]||r.tipo_marcacao)}</td><td>${esc(formatTime(r.horario_correto))}</td><td>${statusBadge(r.status)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Você ainda não possui solicitações.</div>`}</div>`)}
function employeeRequestForm(){const w=submissionWindow();return employeeShell(`<div class="hero"><div><h1>Nova solicitação</h1><p>Informe somente uma marcação por solicitação.</p></div></div><div class="notice info"><strong>Prazo</strong><br>${periodHelp()}</div><div id="requestFormError"></div><div class="card"><form id="employeeRequestForm"><div class="grid grid-2"><div class="field"><label>Data da ocorrência</label><input type="date" id="occurrenceDate" min="${w.min}" max="${w.max}" required><div class="help">Datas fora do prazo ficam bloqueadas automaticamente.</div></div><div class="field"><label>Horário correto</label><input type="time" id="time" required></div></div><div class="grid grid-2"><div class="field"><label>Qual marcação?</label><select id="type" required><option value="">Selecione</option><option value="entrada">Entrada</option><option value="saida_intervalo">Saída para intervalo</option><option value="retorno_intervalo">Retorno do intervalo</option><option value="saida">Saída</option><option value="outro">Outra</option></select></div><div class="field"><label>Motivo</label><select id="reason" required><option value="">Selecione</option><option value="esquecimento">Esqueci de registrar</option><option value="facial_nao_reconhecida">Facial não reconhecida</option><option value="falha_aparelho">Falha do Aparelho</option><option value="atividade_externa">Atividade externa</option><option value="outro">Outro</option></select></div></div><div class="field"><label>Observação <span class="muted" style="font-weight:500">(opcional)</span></label><textarea id="note" placeholder="Se necessário, explique rapidamente o que aconteceu."></textarea></div><div class="help">Anexos serão habilitados depois que configurarmos o armazenamento seguro de arquivos.</div><div class="form-actions"><button type="button" class="btn btn-light" data-go="employee-home">Cancelar</button><button class="btn btn-primary" id="sendRequestBtn">Enviar solicitação</button></div></form></div>`)}
function employeeDetail(){const r=state.requests.find(x=>String(x.id)===String(state.selectedRequestId));if(!r)return employeeHome();const status=statusLabel[r.status]||r.status;let msg='';if(status==='Pendente')msg='<div class="notice warn"><strong>Edição</strong><br>A edição de solicitações pendentes será conectada em uma próxima etapa.</div>';else if(status==='Em análise')msg='<div class="notice info locked"><div>🔒</div><div><strong>Solicitação em análise</strong>O RH já iniciou a tratativa.</div></div>';return employeeShell(`<div class="hero"><div><h1>Solicitação ${protocol(r)}</h1><p>Detalhes da sua solicitação.</p></div>${statusBadge(r.status)}</div>${msg}<div class="card"><div class="detail-list"><div class="detail-item"><span>Data da ocorrência</span><strong>${formatDate(r.data_ocorrencia)}</strong></div><div class="detail-item"><span>Marcação</span><strong>${esc(typeLabel[r.tipo_marcacao]||r.tipo_marcacao)}</strong></div><div class="detail-item"><span>Horário informado</span><strong>${esc(formatTime(r.horario_correto))}</strong></div><div class="detail-item"><span>Motivo</span><strong>${esc(reasonLabel[r.motivo]||r.motivo)}</strong></div><div class="detail-item"><span>Observação</span><strong>${esc(r.observacao||'—')}</strong></div><div class="detail-item"><span>Enviado em</span><strong>${formatDateTime(r.criado_em)}</strong></div>${r.editado_em?`<div class="detail-item"><span>Última edição</span><strong>${formatDateTime(r.editado_em)}</strong></div>`:''}${r.status==='nao_ajustado'?`<div class="detail-item" style="grid-column:1/-1"><span>Justificativa do RH</span><strong>${esc(r.justificativa_nao_ajuste||'—')}</strong></div>`:''}</div><div class="form-actions"><button class="btn btn-light" data-go="employee-home">Voltar</button></div></div>`)}
function successPage(r){return employeeShell(`<div class="card" style="text-align:center;max-width:560px;margin:60px auto"><div class="logo-circle" style="margin:0 auto 18px">✓</div><h1>Solicitação registrada!</h1><p class="subtitle" style="margin-bottom:10px">Seu pedido foi enviado ao RH e gravado no banco.</p><div class="protocol">${protocol(r)}</div><button class="btn btn-primary" id="goHomeAfterSuccess">Voltar ao início</button></div>`)}

function rhLogin(){return`<div class="auth-wrap"><div class="auth-card"><div class="logo-circle">RH</div><div class="real-tag">● Área administrativa</div><h1 style="margin-top:16px">Acesso do RH</h1><p class="subtitle">Entre com seu e-mail corporativo e sua senha.</p>${state.rhLoginMessage?`<div class="notice info">${esc(state.rhLoginMessage)}</div>`:''}<div id="rhLoginError"></div><form id="rhLoginForm"><div class="field"><label>E-mail</label><input type="email" id="rhEmail" autocomplete="username" placeholder="seuemail@empresa.com.br" required></div><div class="field"><label>Senha</label><input type="password" id="rhPassword" autocomplete="current-password" placeholder="Digite sua senha" required></div><button class="btn btn-primary btn-block" id="rhLoginBtn">Entrar</button></form><div class="auth-switch">É colaborador? <button class="link-btn" data-go="employee-login">voltar ao acesso do colaborador</button></div></div></div>`}
function rhShell(content,active='requests'){const n=state.rhUser?.nome||state.rhUser?.email||'RH';return`<div class="shell"><header class="topbar"><div class="brand"><div class="brand-mark">P</div><div>Portal de Ponto — RH<small>${esc(n)}</small></div></div><div class="top-actions"><button class="btn btn-light" id="rhLogout">Sair</button></div></header><main class="container"><div class="split"><aside class="sidebar"><button class="nav-btn ${active==='requests'?'active':''}" data-go="rh-requests">Solicitações</button><button class="nav-btn ${active==='employees'?'active':''}" id="rhEmployeesNav">Colaboradores</button></aside><section>${content}</section></div></main></div>`}

function findRhEmployee(id){return state.rhEmployees.find(e=>String(e.id)===String(id))}
function rhEmployeeRows(list){
  if(!list.length)return`<tr><td colspan="7"><div class="empty">Nenhum colaborador encontrado.</div></td></tr>`;
  return list.map(e=>`<tr><td><strong>${esc(e.nome)}</strong></td><td>${esc(maskCpf(e.cpf))}</td><td>${esc(e.cracha)}</td><td>${esc(e.unidade)}</td><td>${esc(e.setor)}</td><td>${e.ativo?'<span class="badge done">✓ Ativo</span>':'<span class="badge rejected">× Inativo</span>'}</td><td><button class="link-btn rhEditEmployee" data-employee-id="${esc(e.id)}">Editar</button></td></tr>`).join('')
}
function filteredRhEmployees(){
  const q=(document.getElementById('rhEmployeeSearch')?.value||'').trim().toLowerCase(),digits=q.replace(/\D/g,'');
  return [...state.rhEmployees].filter(e=>!q||String(e.nome||'').toLowerCase().includes(q)||(digits&&String(e.cpf||'').includes(digits))||String(e.cracha||'').toLowerCase().includes(q)||String(e.unidade||'').toLowerCase().includes(q)||String(e.setor||'').toLowerCase().includes(q)).sort((a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR'));
}
function rhEmployeeEditor(){
  if(!state.rhEmployeeEditorOpen)return'';
  const e=state.rhEditingEmployeeId?findRhEmployee(state.rhEditingEmployeeId):null;
  return`<div class="card" style="margin-bottom:18px"><div class="section-title"><div><h2>${e?'Editar colaborador':'Novo colaborador'}</h2><p class="muted" style="margin:5px 0 0">${e?'Atualize os dados ou altere a situação do acesso.':'Cadastre os dados usados no acesso do colaborador.'}</p></div></div><div id="rhEmployeeFormError"></div><form id="rhEmployeeForm"><div class="grid grid-2"><div class="field"><label>Nome completo</label><input id="rhEmployeeName" value="${esc(e?.nome||'')}" required></div><div class="field"><label>CPF</label><input id="rhEmployeeCpf" inputmode="numeric" maxlength="14" value="${esc(e?maskCpf(e.cpf):'')}" placeholder="Pode digitar com ou sem pontuação" required></div><div class="field"><label>Nº do crachá</label><input id="rhEmployeeBadge" value="${esc(e?.cracha||'')}" required></div><div class="field"><label>Unidade</label><input id="rhEmployeeUnit" value="${esc(e?.unidade||'')}" required></div><div class="field"><label>Setor</label><input id="rhEmployeeSector" value="${esc(e?.setor||'')}" required></div><div class="field"><label>Situação</label><select id="rhEmployeeActive"><option value="true" ${e?.ativo!==false?'selected':''}>Ativo</option><option value="false" ${e?.ativo===false?'selected':''}>Inativo</option></select><div class="help">Colaborador inativo não consegue entrar no portal, mas o histórico é preservado.</div></div></div><div class="form-actions"><button type="button" class="btn btn-light" id="rhCancelEmployee">Cancelar</button><button class="btn btn-primary" id="rhSaveEmployee">Salvar colaborador</button></div></form></div>`;
}
function rhEmployeesPage(){
  const total=state.rhEmployees.length,active=state.rhEmployees.filter(e=>e.ativo).length,inactive=total-active;
  const list=[...state.rhEmployees].sort((a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR'));
  return rhShell(`<div class="hero"><div><h1>Colaboradores</h1><p>Cadastre, edite ou inative acessos ao Portal de Ponto.</p></div><button class="btn btn-primary" id="rhNewEmployee">+ Novo colaborador</button></div>${state.rhEmployeeNotice?`<div class="notice success">${esc(state.rhEmployeeNotice)}</div>`:''}<div class="rh-summary"><div class="card mini"><span>Ativos</span><strong>${active}</strong></div><div class="card mini"><span>Inativos</span><strong>${inactive}</strong></div><div class="card mini"><span>Total</span><strong>${total}</strong></div></div>${rhEmployeeEditor()}<div class="card"><div class="section-title"><h2>Lista de colaboradores</h2><button class="btn btn-light" id="refreshRhEmployees">Atualizar</button></div><div class="field" style="margin-bottom:14px"><input id="rhEmployeeSearch" placeholder="Buscar por nome, CPF, crachá, unidade ou setor"></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>CPF</th><th>Crachá</th><th>Unidade</th><th>Setor</th><th>Situação</th><th></th></tr></thead><tbody id="rhEmployeeBody">${rhEmployeeRows(list)}</tbody></table></div></div>`,'employees');
}

function sortRhRequests(list){const p={pendente:0,em_analise:1,concluido:2,nao_ajustado:2};return [...list].sort((a,b)=>{const pa=p[a.status]??3,pb=p[b.status]??3;if(pa!==pb)return pa-pb;const ta=new Date(a.criado_em||0).getTime(),tb=new Date(b.criado_em||0).getTime();return pa<2?ta-tb:tb-ta})}
function rhFilteredRequests(){const q=(document.getElementById('rhSearch')?.value||'').trim().toLowerCase(),digits=q.replace(/\D/g,''),status=document.getElementById('rhStatus')?.value??'open',unit=document.getElementById('rhUnit')?.value||'',sector=document.getElementById('rhSector')?.value||'',date=document.getElementById('rhDate')?.value||'';return sortRhRequests(state.rhRequests).filter(r=>{const c=collaboratorOf(r),prot=String(r.protocolo??'');const matchQ=!q||String(c.nome||'').toLowerCase().includes(q)||(digits&&String(c.cpf||'').includes(digits))||String(c.cracha||'').toLowerCase().includes(q)||prot.includes(q.replace('#',''));const matchStatus=status==='open'?(r.status==='pendente'||r.status==='em_analise'):(!status||r.status===status);return matchQ&&matchStatus&&(!unit||requestUnit(r)===unit)&&(!sector||requestSector(r)===sector)&&(!date||r.data_ocorrencia===date)})}
function rhRequestRows(list){if(!list.length)return`<tr><td colspan="8"><div class="empty">Nenhuma solicitação encontrada.</div></td></tr>`;return list.map(r=>{const c=collaboratorOf(r);return`<tr class="clickable" data-rh-request="${esc(r.id)}"><td>${protocol(r)}</td><td>${esc(c.nome||'—')}</td><td>${esc(c.cracha||'—')}</td><td>${formatDate(r.data_ocorrencia)}</td><td>${esc(typeLabel[r.tipo_marcacao]||r.tipo_marcacao)}</td><td>${esc(formatTime(r.horario_correto))}</td><td>${esc(requestUnit(r))}</td><td>${statusBadge(r.status)}</td></tr>`}).join('')}
function rhRequestsPage(){const all=state.rhRequests,open=all.filter(r=>r.status==='pendente'||r.status==='em_analise').length,pending=all.filter(r=>r.status==='pendente').length,analysis=all.filter(r=>r.status==='em_analise').length;const units=[...new Set(all.map(requestUnit).filter(x=>x&&x!=='—'))].sort(),sectors=[...new Set(all.map(requestSector).filter(x=>x&&x!=='—'))].sort();const initial=sortRhRequests(all).filter(r=>r.status==='pendente'||r.status==='em_analise');return rhShell(`<div class="hero"><div><h1>Solicitações</h1><p>Acompanhe e trate as ocorrências enviadas pelos colaboradores.</p></div><button class="btn btn-light" id="refreshRh">Atualizar</button></div><div class="rh-summary"><div class="card mini"><span>Pendentes</span><strong>${pending}</strong></div><div class="card mini"><span>Em análise</span><strong>${analysis}</strong></div><div class="card mini"><span>Em aberto</span><strong>${open}</strong></div></div><div class="card"><div class="filters rh-filters"><input id="rhSearch" placeholder="Nome, CPF, crachá ou protocolo"><select id="rhStatus"><option value="open" selected>Em aberto</option><option value="">Todos os status</option><option value="pendente">Pendente</option><option value="em_analise">Em análise</option><option value="concluido">Concluído</option><option value="nao_ajustado">Não ajustado</option></select><select id="rhUnit"><option value="">Todas as unidades</option>${units.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="rhSector"><option value="">Todos os setores</option>${sectors.map(x=>`<option>${esc(x)}</option>`).join('')}</select><input type="date" id="rhDate"></div><div class="table-wrap"><table><thead><tr><th>Nº</th><th>Colaborador</th><th>Crachá</th><th>Data</th><th>Marcação</th><th>Horário</th><th>Unidade</th><th>Status</th></tr></thead><tbody id="rhRequestsBody">${rhRequestRows(initial)}</tbody></table></div></div>`,'requests')}
function rhRequestDetail(){
  const r=state.rhRequests.find(x=>String(x.id)===String(state.rhSelectedRequestId));
  if(!r)return rhRequestsPage();
  const c=collaboratorOf(r);
  let treatment='';
  if(r.status==='pendente'){
    treatment=`<div class="card inline-card"><h2>Tratamento do RH</h2><p class="muted">Ao iniciar a análise, o colaborador não poderá alterar esta solicitação.</p><div id="rhActionError"></div><div class="form-actions"><button class="btn btn-blue" id="rhStartAnalysis">Iniciar análise</button></div></div>`;
  }else if(r.status==='em_analise'){
    treatment=`<div class="card inline-card"><h2>Tratamento do RH</h2><div id="rhActionError"></div><div class="field"><label>Observação interna <span class="muted" style="font-weight:500">(opcional)</span></label><textarea id="rhInternalNote" placeholder="Anotação interna do RH. O colaborador não verá este campo.">${esc(r.observacao_interna||'')}</textarea></div><div class="field"><label>Justificativa para não ajustar</label><textarea id="rhRejectReason" placeholder="Preencha somente se a solicitação não for ajustada."></textarea><div class="help">A justificativa é obrigatória apenas ao clicar em “Não ajustar” e ficará visível ao colaborador.</div></div><div class="form-actions"><button class="btn btn-light" id="rhBackPending">Voltar para pendente</button><button class="btn btn-danger" id="rhReject">Não ajustar</button><button class="btn btn-success" id="rhComplete">Concluir ajuste</button></div></div>`;
  }else{
    treatment=`<div class="notice ${r.status==='concluido'?'success':'warn'}"><strong>${r.status==='concluido'?'Solicitação concluída':'Solicitação não ajustada'}</strong><br>Este registro está finalizado e não pode mais ser alterado pelo colaborador.</div>`;
  }
  return rhShell(`<div class="hero"><div><h1>Solicitação ${protocol(r)}</h1><p>${esc(c.nome||'Colaborador')} • Crachá ${esc(c.cracha||'—')}</p></div>${statusBadge(r.status)}</div><div class="card"><div class="detail-list"><div class="detail-item"><span>Colaborador</span><strong>${esc(c.nome||'—')}</strong></div><div class="detail-item"><span>CPF</span><strong>${esc(maskCpf(c.cpf||''))}</strong></div><div class="detail-item"><span>Crachá</span><strong>${esc(c.cracha||'—')}</strong></div><div class="detail-item"><span>Unidade / Setor</span><strong>${esc(requestUnit(r))} • ${esc(requestSector(r))}</strong></div><div class="detail-item"><span>Data da ocorrência</span><strong>${formatDate(r.data_ocorrencia)}</strong></div><div class="detail-item"><span>Marcação</span><strong>${esc(typeLabel[r.tipo_marcacao]||r.tipo_marcacao)}</strong></div><div class="detail-item"><span>Horário correto</span><strong>${esc(formatTime(r.horario_correto))}</strong></div><div class="detail-item"><span>Motivo</span><strong>${esc(reasonLabel[r.motivo]||r.motivo)}</strong></div><div class="detail-item" style="grid-column:1/-1"><span>Observação do colaborador</span><strong>${esc(r.observacao||'—')}</strong></div><div class="detail-item"><span>Enviado em</span><strong>${formatDateTime(r.criado_em)}</strong></div><div class="detail-item"><span>Origem</span><strong>${r.origem==='rh'?'RH':'Colaborador'}</strong></div>${r.iniciado_em?`<div class="detail-item"><span>Análise iniciada em</span><strong>${formatDateTime(r.iniciado_em)}</strong></div>`:''}${r.finalizado_em?`<div class="detail-item"><span>Finalizado em</span><strong>${formatDateTime(r.finalizado_em)}</strong></div>`:''}${r.justificativa_nao_ajuste?`<div class="detail-item" style="grid-column:1/-1"><span>Justificativa de não ajuste</span><strong>${esc(r.justificativa_nao_ajuste)}</strong></div>`:''}${r.observacao_interna?`<div class="detail-item" style="grid-column:1/-1"><span>Observação interna</span><strong>${esc(r.observacao_interna)}</strong></div>`:''}</div><div class="form-actions"><button class="btn btn-light" data-go="rh-requests">Voltar</button></div></div>${treatment}`,'requests')}

function render(){const app=document.getElementById('app');const pages={'employee-login':employeeLogin,'employee-home':employeeHome,'employee-new':employeeRequestForm,'employee-detail':employeeDetail,'rh-login':rhLogin,'rh-requests':rhRequestsPage,'rh-request-detail':rhRequestDetail,'rh-employees':rhEmployeesPage};app.innerHTML=(pages[state.page]||employeeLogin)();bind()}
function setButtonLoading(btn,on,text='Aguarde...'){if(!btn)return;if(on){btn.dataset.original=btn.innerHTML;btn.disabled=true;btn.innerHTML=`<span class="loading"></span>${text}`}else{btn.disabled=false;btn.innerHTML=btn.dataset.original||'Enviar'}}
function bindRhFilters(){['rhSearch','rhStatus','rhUnit','rhSector','rhDate'].forEach(id=>document.getElementById(id)?.addEventListener(id==='rhSearch'?'input':'change',()=>{const body=document.getElementById('rhRequestsBody');if(body)body.innerHTML=rhRequestRows(rhFilteredRequests());bindRhRows()}))}
function bindRhRows(){document.querySelectorAll('[data-rh-request]').forEach(row=>row.addEventListener('click',()=>{state.rhSelectedRequestId=row.dataset.rhRequest;state.page='rh-request-detail';render()}))}

function bindRhEmployeeRows(){document.querySelectorAll('.rhEditEmployee').forEach(btn=>btn.addEventListener('click',()=>{state.rhEditingEmployeeId=btn.dataset.employeeId;state.rhEmployeeEditorOpen=true;state.rhEmployeeNotice='';render()}))}
function refreshRhEmployeeTable(){const body=document.getElementById('rhEmployeeBody');if(body){body.innerHTML=rhEmployeeRows(filteredRhEmployees());bindRhEmployeeRows()}}

function bind(){
  document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>{state.page=el.dataset.go;render()}));
  document.getElementById('employeeLoginForm')?.addEventListener('submit',async e=>{
    e.preventDefault();state.loginMessage='';const btn=document.getElementById('loginBtn'),errorBox=document.getElementById('loginError');errorBox.innerHTML='';setButtonLoading(btn,true,'Entrando...');
    try{const cpfNormalizado=(document.getElementById('cpf').value||'').replace(/\D/g,'').slice(0,11),crachaNormalizado=(document.getElementById('badge').value||'').trim();const data=await callFunction(FUNCTIONS.login,{cpf:cpfNormalizado,cracha:crachaNormalizado});state.currentUser=data.colaborador;state.token=data.sessao.token;saveSession();await refreshRequests();state.page='employee-home';render()}
    catch(err){errorBox.innerHTML=`<div class="notice error">${esc(err.message)}</div>`;setButtonLoading(btn,false)}
  });
  document.getElementById('employeeLogout')?.addEventListener('click',()=>{clearSession();state.page='employee-login';render()});
  document.getElementById('refreshMine')?.addEventListener('click',async e=>{const btn=e.currentTarget;setButtonLoading(btn,true,'Atualizando...');try{await refreshRequests();render()}catch(err){if(state.page==='employee-login')render();else{alert(err.message);setButtonLoading(btn,false)}}});
  document.getElementById('employeeRequestForm')?.addEventListener('submit',async e=>{
    e.preventDefault();const btn=document.getElementById('sendRequestBtn'),box=document.getElementById('requestFormError');box.innerHTML='';setButtonLoading(btn,true,'Enviando...');
    const payload={token:state.token,data_ocorrencia:document.getElementById('occurrenceDate').value,tipo_marcacao:document.getElementById('type').value,horario_correto:document.getElementById('time').value,motivo:document.getElementById('reason').value,observacao:document.getElementById('note').value.trim()};
    try{const data=await callFunction(FUNCTIONS.create,payload);await refreshRequests();state.selectedRequestId=data.solicitacao.id;document.getElementById('app').innerHTML=successPage(data.solicitacao);bind()}
    catch(err){if(err.status===401){clearSession();state.loginMessage='Sua sessão expirou. Entre novamente.';state.page='employee-login';render();return}box.innerHTML=`<div class="notice error">${esc(err.message)}</div>`;setButtonLoading(btn,false)}
  });
  document.querySelectorAll('[data-employee-request]').forEach(row=>row.addEventListener('click',()=>{state.selectedRequestId=row.dataset.employeeRequest;state.page='employee-detail';render()}));
  document.getElementById('goHomeAfterSuccess')?.addEventListener('click',()=>{state.page='employee-home';render()});

  document.getElementById('rhLoginForm')?.addEventListener('submit',async e=>{
    e.preventDefault();state.rhLoginMessage='';const btn=document.getElementById('rhLoginBtn'),box=document.getElementById('rhLoginError');box.innerHTML='';setButtonLoading(btn,true,'Entrando...');
    try{const email=(document.getElementById('rhEmail').value||'').trim(),password=document.getElementById('rhPassword').value||'';const auth=await authSignIn(email,password);state.rhAccessToken=auth.access_token;state.rhRefreshToken=auth.refresh_token;state.rhUser=auth.user||{email};saveRhSession();await refreshRhRequests();state.page='rh-requests';render()}
    catch(err){if(err.status===403)box.innerHTML='<div class="notice error">Seu usuário existe, mas não está autorizado para a área do RH.</div>';else box.innerHTML=`<div class="notice error">${esc(err.message)}</div>`;clearRhSession();setButtonLoading(btn,false)}
  });
  document.getElementById('rhLogout')?.addEventListener('click',async()=>{await authLogout();clearRhSession();state.page='rh-login';render()});
  document.getElementById('refreshRh')?.addEventListener('click',async e=>{const btn=e.currentTarget;setButtonLoading(btn,true,'Atualizando...');try{await refreshRhRequests();render()}catch(err){if(state.page==='rh-login')render();else{alert(err.message);setButtonLoading(btn,false)}}});
  document.getElementById('rhEmployeesNav')?.addEventListener('click',async()=>{state.page='rh-employees';state.rhEmployeeNotice='';render();try{await refreshRhEmployees();render()}catch(err){if(state.page==='rh-login')render();else alert(err.message)}});
  document.getElementById('rhNewEmployee')?.addEventListener('click',()=>{state.rhEditingEmployeeId=null;state.rhEmployeeEditorOpen=true;state.rhEmployeeNotice='';render()});
  document.getElementById('rhCancelEmployee')?.addEventListener('click',()=>{state.rhEmployeeEditorOpen=false;state.rhEditingEmployeeId=null;render()});
  document.getElementById('rhEmployeeSearch')?.addEventListener('input',refreshRhEmployeeTable);
  document.getElementById('refreshRhEmployees')?.addEventListener('click',async e=>{const btn=e.currentTarget;setButtonLoading(btn,true,'Atualizando...');try{await refreshRhEmployees();render()}catch(err){if(state.page==='rh-login')render();else{alert(err.message);setButtonLoading(btn,false)}}});
  document.getElementById('rhEmployeeForm')?.addEventListener('submit',async e=>{
    e.preventDefault();const btn=document.getElementById('rhSaveEmployee'),box=document.getElementById('rhEmployeeFormError');box.innerHTML='';setButtonLoading(btn,true,'Salvando...');
    const payload={id:state.rhEditingEmployeeId||'',nome:(document.getElementById('rhEmployeeName').value||'').trim(),cpf:(document.getElementById('rhEmployeeCpf').value||'').replace(/\D/g,'').slice(0,11),cracha:(document.getElementById('rhEmployeeBadge').value||'').trim(),unidade:(document.getElementById('rhEmployeeUnit').value||'').trim(),setor:(document.getElementById('rhEmployeeSector').value||'').trim(),ativo:document.getElementById('rhEmployeeActive').value==='true'};
    try{const data=await saveRhEmployee(payload);await refreshRhEmployees();state.rhEmployeeEditorOpen=false;state.rhEditingEmployeeId=null;state.rhEmployeeNotice=data.mensagem||'Colaborador salvo com sucesso.';render()}
    catch(err){if(state.page==='rh-login'){render();return}box.innerHTML=`<div class="notice error">${esc(err.message)}</div>`;setButtonLoading(btn,false)}
  });
  bindRhEmployeeRows();

  const runRhAction=async(acao,btn)=>{
    const box=document.getElementById('rhActionError');if(box)box.innerHTML='';setButtonLoading(btn,true,'Salvando...');
    const payload={solicitacao_id:state.rhSelectedRequestId,acao,observacao_interna:(document.getElementById('rhInternalNote')?.value||'').trim(),justificativa:(document.getElementById('rhRejectReason')?.value||'').trim()};
    try{await executarAcaoRh(payload);await refreshRhRequests();render()}
    catch(err){if(state.page==='rh-login'){render();return}if(box)box.innerHTML=`<div class="notice error">${esc(err.message)}</div>`;setButtonLoading(btn,false)}
  };
  document.getElementById('rhStartAnalysis')?.addEventListener('click',e=>runRhAction('iniciar_analise',e.currentTarget));
  document.getElementById('rhComplete')?.addEventListener('click',e=>runRhAction('concluir',e.currentTarget));
  document.getElementById('rhReject')?.addEventListener('click',e=>runRhAction('nao_ajustar',e.currentTarget));
  document.getElementById('rhBackPending')?.addEventListener('click',e=>runRhAction('voltar_pendente',e.currentTarget));
  bindRhFilters();bindRhRows();
}

async function bootstrap(){
  const empToken=sessionStorage.getItem('pp_real_token');let empUser=null;try{empUser=JSON.parse(sessionStorage.getItem('pp_real_user')||'null')}catch{}
  const rhAccess=sessionStorage.getItem('pp_rh_access'),rhRefresh=sessionStorage.getItem('pp_rh_refresh');let rhUser=null;try{rhUser=JSON.parse(sessionStorage.getItem('pp_rh_user')||'null')}catch{}
  if(rhAccess&&rhUser){state.rhAccessToken=rhAccess;state.rhRefreshToken=rhRefresh;state.rhUser=rhUser;state.page='rh-requests';render();try{await refreshRhRequests();render()}catch{if(state.page==='rh-login')render()}return}
  if(empToken&&empUser){state.token=empToken;state.currentUser=empUser;state.page='employee-home';render();try{await refreshRequests();render()}catch{if(state.page==='employee-login')render()}return}
  render();
}
bootstrap();

</script>
</body>
